name: Deploy Project to Azure VM

on:
  push:
    branches: [ "main" ]
    paths:
      - 'dags/manifest.json'  
  workflow_dispatch:        

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Execute remote SSH commands to sync repo and trigger DAG
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          script: |
            echo "Conectado a la VM. Actualizando repositorio..."
            cd ~/proyecto-data
            

            git pull origin main --no-rebase
            
            sleep 3
            
            echo "Disparando el DAG en el contenedor de Airflow..."
            docker exec airflow_scheduler airflow dags trigger favorita_pipeline
            
            echo "¡Despliegue y ejecución iniciados correctamente!"
